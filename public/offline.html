<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sereno - Modo Offline</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.4));
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 800;
        }
        p {
            font-size: 16px;
            color: #94a3b8;
            max-width: 400px;
            line-height: 1.6;
        }
        .status {
            margin-top: 30px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            color: #6366f1;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        button {
            margin-top: 40px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="icon">🧘</div>
    <h1>Você está Offline</h1>
    <p>O Sereno continua aqui com você. Experimente as meditações e técnicas que já usamos antes!</p>
    <div class="status">Modo Offline Ativado</div>
    <button onclick="window.location.reload()">Tentar Reconectar</button>
</body>
</html>
